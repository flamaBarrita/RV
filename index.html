<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR Estática - Nave Espacial</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, maximum-scale=1" />

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <style>
      body, html { 
        margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; 
        background-color: black; 
      }
      
      #fondo-camara {
        position: absolute;
        top: 0; left: 0; width: 100vw; height: 100vh;
        object-fit: cover;
        z-index: 0;
      }

      .a-canvas {
        background: transparent !important;
        z-index: 1 !important;
      }

      #btn-reiniciar {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(255, 255, 255, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.5);
        color: white;
        padding: 8px 20px;
        border-radius: 20px;
        font-family: sans-serif;
        font-size: 14px;
        cursor: pointer;
        z-index: 10;
        backdrop-filter: blur(5px);
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      }
      #btn-reiniciar:active {
        background: rgba(255, 255, 255, 0.4);
      }
    </style>

    <script>
      // Activar la cámara de fondo independientemente de A-Frame
      window.addEventListener("load", () => {
        const video = document.getElementById('fondo-camara');
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
          .then((stream) => { video.srcObject = stream; })
          .catch((err) => { console.error("Error de cámara:", err); });
      });

      AFRAME.registerComponent('nave-interactiva', {
        init: function () {
          const audio = document.querySelector("#musica-espacio");

          this.el.addEventListener('click', () => {
            audio.currentTime = 0;
            audio.play().catch(e => console.log("El navegador bloqueó el audio", e));
            this.el.emit('activar-hiperimpulsor');
          });
        }
      });

      function reiniciarEscena() {
        const nave = document.querySelector("#mi-nave");
        const audio = document.querySelector("#musica-espacio");

        audio.pause();
        audio.currentTime = 0;

        nave.removeAttribute('animation__giro');
        nave.removeAttribute('animation__escape');

        // Regresar la nave al centro de la pantalla
        nave.setAttribute('position', '0 0 -6');
        nave.setAttribute('rotation', '0 0 0');

        setTimeout(() => {
          nave.setAttribute('animation__giro', 'property: rotation; by: 360 720 0; dur: 1500; startEvents: activar-hiperimpulsor; easing: easeOutQuad');
          nave.setAttribute('animation__escape', 'property: position; to: 0 50 -100; dur: 2500; startEvents: activar-hiperimpulsor; easing: easeInCubic');
        }, 50);
      }
    </script>
  </head>

  <body>
    
    <video id="fondo-camara" autoplay playsinline></video>
    <button id="btn-reiniciar" onclick="reiniciarEscena()">Reiniciar</button>
    <audio id="musica-espacio" src="musica.mp3" preload="auto"></audio>

    <a-scene
      renderer="alpha: true; logarithmicDepthBuffer: true; colorManagement: true;"
      cursor="rayOrigin: mouse"
      raycaster="objects: .interactivo"
      vr-mode-ui="enabled: false"
    >
      
      <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
      <a-light type="directional" color="#ffffff" intensity="1" position="1 3 2"></a-light>

      <a-assets>
        <a-asset-item id="nave1" src="Swift.glb"></a-asset-item>
      </a-assets>

      <a-entity
        id="mi-nave"
        class="interactivo"
        gltf-model="#nave1"
        position="0 0 -6"
        scale="0.15 0.15 0.15"
        nave-interactiva
        animation__flote="property: position; dir: alternate; dur: 2000; to: 0 0.5 -6; loop: true; easing: easeInOutSine"
        animation__giro="property: rotation; by: 360 720 0; dur: 1500; startEvents: activar-hiperimpulsor; easing: easeOutQuad"
        animation__escape="property: position; to: 0 50 -100; dur: 2500; startEvents: activar-hiperimpulsor; easing: easeInCubic"
      ></a-entity>

      <!-- Cámara estática pura, sin 'look-controls' que acceda a sensores -->
      <a-entity camera position="0 0 0"></a-entity>
      
    </a-scene>

  </body>
</html>
