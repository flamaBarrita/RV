<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR Espacial - Proyecto de Mario</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- AR.js para A-Frame -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

    <!-- Componente para activar la órbita y la música al tocar -->
    <script>
      AFRAME.registerComponent('activar-interaccion', {
        init: function () {
          // Buscamos la etiqueta de audio en el HTML
          const audio = document.querySelector("#musica-espacio");
          // Identificamos el contenedor padre (el que se encarga de la órbita)
          const contenedorPadre = this.el.parentNode;

          // Evento que escucha cuando el usuario toca el modelo 3D
          this.el.addEventListener('click', () => {
            // 1. Reproducir la música si no está sonando
            if (audio.paused) {
              audio.play();
            }
            
            // 2. Avisarle al contenedor padre que inicie la animación de rotación (órbita)
            contenedorPadre.emit('empezar-orbita');
          });
        }
      });
    </script>

    <style>
      .instrucciones {
        position: absolute;
        bottom: 20px;
        width: 100%;
        text-align: center;
        z-index: 1000;
        color: white;
        font-family: sans-serif;
        font-weight: bold;
        text-shadow: 2px 2px 4px #000000;
        pointer-events: none; /* Evita que el texto bloquee los toques a la pantalla */
      }
    </style>
  </head>

  <body style="margin: 0; overflow: hidden">
    
    <!-- Texto flotante en pantalla -->
    <div class="instrucciones">Toca una nave o luna para iniciar la exploración y la música</div>

    <!-- Archivo de Audio (Debe estar en tu carpeta) -->
    <audio id="musica-espacio" src="musica.mp3" preload="auto"></audio>

    <!-- 
      Añadimos:
      - cursor="rayOrigin: mouse" para que los toques en la pantalla funcionen como clics.
      - raycaster="objects: .interactivo" para que el sistema solo busque clics en los modelos, mejorando el rendimiento.
      - colorManagement: true para que las texturas originales se vean con colores vivos.
    -->
    <a-scene
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true; colorManagement: true;"
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
      cursor="rayOrigin: mouse"
      raycaster="objects: .interactivo"
    >
      <!-- Carga de los modelos 3D espaciales -->
      <a-assets>
        <a-asset-item id="nave1" src="modelo1.glb"></a-asset-item>
        <a-asset-item id="luna" src="modelo2.glb"></a-asset-item>
        <a-asset-item id="nave2" src="modelo3.glb"></a-asset-item>
      </a-assets>

      <a-marker preset="kanji">
        
        <!-- ==========================================
             1. EJE X (Órbita de la Nave 1)
             ========================================== -->
        <!-- La animación de órbita está pausada hasta recibir el evento 'empezar-orbita' -->
        <a-entity animation="property: rotation; to: 360 0 0; loop: true; dur: 4000; easing: linear; startEvents: empezar-orbita">
          <!-- El modelo en sí tiene un movimiento de flote y la clase interactivo -->
          <a-entity
            class="interactivo"
            gltf-model="#nave1"
            position="0 0.8 0"
            scale="0.3 0.3 0.3"
            activar-interaccion
            animation="property: position; dir: alternate; dur: 2000; to: 0 0.9 0; loop: true; easing: easeInOutSine"
          ></a-entity>
        </a-entity>

        <!-- ==========================================
             2. EJE Y (Órbita de la Luna)
             ========================================== -->
        <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear; startEvents: empezar-orbita">
          <a-entity
            class="interactivo"
            gltf-model="#luna"
            position="0.8 0 0"
            scale="0.3 0.3 0.3"
            activar-interaccion
            animation="property: position; dir: alternate; dur: 2500; to: 0.8 0.1 0; loop: true; easing: easeInOutSine"
          ></a-entity>
        </a-entity>

        <!-- ==========================================
             3. EJE Z (Órbita de la Nave 2)
             ========================================== -->
        <a-entity animation="property: rotation; to: 0 0 360; loop: true; dur: 6000; easing: linear; startEvents: empezar-orbita">
          <a-entity
            class="interactivo"
            gltf-model="#nave2"
            position="0.6 0.6 0"
            scale="0.3 0.3 0.3"
            activar-interaccion
            animation="property: position; dir: alternate; dur: 2200; to: 0.6 0.7 0; loop: true; easing: easeInOutSine"
          ></a-entity>
        </a-entity>

      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
