<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Realidad Aumentada - 3 Órbitas, Color y Opacidad</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- AR.js para A-Frame -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

    <style>
      .arjs-loader {
        height: 100%;
        width: 100%;
        position: absolute;
        top: 0;
        left: 0;
        background-color: rgba(0, 0, 0, 0.8);
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .arjs-loader div {
        text-align: center;
        font-size: 1.25em;
        color: white;
        font-family: sans-serif;
      }
    </style>

    <!-- Componente customizado para forzar color y opacidad en archivos .glb -->
    <script>
      AFRAME.registerComponent("modificar-material", {
        schema: {
          color: { type: "color", default: "#ffffff" },
          opacidad: { type: "number", default: 1.0 }
        },
        init: function () {
          this.el.addEventListener("model-loaded", () => {
            const obj = this.el.getObject3D("mesh");
            if (!obj) return;
            
            obj.traverse((node) => {
              if (node.isMesh && node.material) {
                // Tiñe el material del GLB
                node.material.color.set(this.data.color);
                
                // Aplica opacidad si es menor a 1
                if (this.data.opacidad < 1.0) {
                  node.material.transparent = true;
                  node.material.opacity = this.data.opacidad;
                  node.material.depthWrite = false;
                }
                
                // Fuerza a Three.js a actualizar el material
                node.material.needsUpdate = true;
              }
            });
          });
        }
      });
    </script>
  </head>

  <body style="margin: 0; overflow: hidden">
    <!-- Pantalla de carga -->
    <div class="arjs-loader">
      <div>Cargando AR...</div>
    </div>

    <a-scene
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true;"
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
    >
      <!-- Asegúrate de tener estos 3 modelos en tu carpeta -->
      <a-assets>
        <a-asset-item id="modelo1" src="modelo1.glb"></a-asset-item>
        <a-asset-item id="modelo2" src="modelo2.glb"></a-asset-item>
        <a-asset-item id="modelo3" src="modelo3.glb"></a-asset-item>
      </a-assets>

      <a-marker preset="kanji">
        
        <!-- ==========================================
             1. ANIMACIÓN EN EJE X (Órbita Vertical)
             ========================================== -->
        <a-entity animation="property: rotation; to: 360 0 0; loop: true; dur: 4000; easing: linear">
          <!-- El modelo está desplazado (position Y=0.8) para que orbite alrededor del centro -->
          <a-entity
            gltf-model="#modelo1"
            position="0 0.8 0"
            scale="0.3 0.3 0.3"
            modificar-material="color: #ff3333; opacidad: 0.8"
          ></a-entity>
        </a-entity>

        <!-- ==========================================
             2. ANIMACIÓN EN EJE Y (Órbita Horizontal)
             ========================================== -->
        <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear">
          <!-- El modelo está desplazado (position X=0.8) -->
          <a-entity
            gltf-model="#modelo2"
            position="0.8 0 0"
            scale="0.3 0.3 0.3"
            modificar-material="color: #33ff33; opacidad: 0.5"
          ></a-entity>
        </a-entity>

        <!-- ==========================================
             3. ANIMACIÓN EN EJE Z (Órbita Frontal)
             ========================================== -->
        <a-entity animation="property: rotation; to: 0 0 360; loop: true; dur: 6000; easing: linear">
          <!-- El modelo está desplazado (position X y Y) -->
          <a-entity
            gltf-model="#modelo3"
            position="0.6 0.6 0"
            scale="0.3 0.3 0.3"
            modificar-material="color: #3333ff; opacidad: 0.6"
          ></a-entity>
        </a-entity>

      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // Quitar la pantalla de carga cuando todo esté listo
      window.addEventListener("load", () => {
        const loader = document.querySelector(".arjs-loader");
        if (loader) loader.remove();
      });
    </script>
  </body>
</html>
