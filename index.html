<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR Estática - Nave Espacial</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, maximum-scale=1" />

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <style>
      body, html {
        margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%;
        background-color: black;
        touch-action: none;
      }

      #fondo-camara {
        position: absolute;
        top: 0; left: 0; width: 100vw; height: 100vh;
        object-fit: cover;
        z-index: 0;
      }

      .a-canvas {
        background: transparent !important;
        z-index: 1 !important;
      }

      #btn-reiniciar {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(255, 255, 255, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.5);
        color: white;
        padding: 8px 20px;
        border-radius: 20px;
        font-family: sans-serif;
        font-size: 14px;
        cursor: pointer;
        z-index: 10;
        backdrop-filter: blur(5px);
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      }
      #btn-reiniciar:active {
        background: rgba(255, 255, 255, 0.4);
      }
    </style>

    <script>
      window.addEventListener("load", () => {
        const video = document.getElementById('fondo-camara');
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
          .then((stream) => { video.srcObject = stream; })
          .catch((err) => { console.error("Error de cámara:", err); });
      });

      let zoom = 1;

      AFRAME.registerComponent('ajustar-tamano', {
        init: function () {
          this.el.addEventListener('model-loaded', () => {
            const modelo = this.el.getObject3D('mesh');
            const caja = new THREE.Box3().setFromObject(modelo);
            modelo.position.sub(caja.getCenter(new THREE.Vector3()));
            this.tam = caja.getSize(new THREE.Vector3());
            this.ajustar();
          });
          window.addEventListener('resize', () => this.ajustar());
        },
        ajustar: function () {
          if (!this.tam) return;
          const alto = 2 * 6 * Math.tan(THREE.MathUtils.degToRad(40));
          const ancho = alto * window.innerWidth / window.innerHeight;
          const escala = Math.min(ancho * 0.55 / this.tam.x, alto * 0.35 / this.tam.y);
          this.el.object3D.scale.setScalar(escala);
          document.querySelector('#zona-toque').setAttribute('radius', Math.max(this.tam.x, this.tam.y) * escala * 0.55);
        }
      });

      AFRAME.registerComponent('nave-interactiva', {
        init: function () {
          this.audio = document.querySelector("#musica-espacio");
          this.reiniciar();
          this.el.addEventListener('click', () => this.lanzar());
        },

        reiniciar: function () {
          this.fase = 'reposo';
          this.t = 0;
          this.giro = 0;
          const o = this.el.object3D;
          o.position.set(0, 0, 0);
          o.rotation.set(0, 0, 0);
          o.scale.setScalar(1);
          o.visible = true;
        },

        lanzar: function () {
          if (this.fase !== 'reposo') return;
          if (this.audio.paused) {
            this.audio.currentTime = 0;
            this.audio.play().catch(e => console.log("El navegador bloqueó el audio", e));
          }
          this.fase = 'despegue';
          this.t = 0;
          this.onda('#7fe3ff');
        },

        onda: function (color) {
          const onda = document.querySelector('#onda');
          onda.setAttribute('material', 'color', color);
          onda.emit('pulso');
        },

        tick: function (tiempo, dt) {
          if (!dt) return;
          this.t += Math.min(dt, 50);
          const o = this.el.object3D;

          if (this.fase === 'reposo') {
            this.giro += dt * 0.0004;
            o.rotation.y = this.giro;
          }

          if (this.fase === 'despegue') {
            const p = Math.min(this.t / 1500, 1);
            const e = p * p * p;
            o.position.set(0, 3 * e, -40 * e);
            o.rotation.set(0, this.giro + e * Math.PI * 2, e * Math.PI * 4);
            if (p === 1) {
              o.visible = false;
              this.fase = 'regreso';
              this.t = 0;
              this.onda('#c89bff');
            }
          }

          if (this.fase === 'regreso') {
            const p = Math.min(this.t / 1200, 1);
            const e = 1 - Math.pow(1 - p, 3);
            o.visible = true;
            o.position.set(0, 0, 0);
            o.scale.setScalar(Math.max(e, 0.001));
            o.rotation.set(0, (1 - e) * Math.PI * 4, 0);
            if (p === 1) {
              this.giro = 0;
              this.fase = 'reposo';
            }
          }
        }
      });

      function aplicarZoom(valor) {
        zoom = Math.min(Math.max(valor, 0.3), 3);
        document.querySelector('#ancla').object3D.scale.setScalar(zoom);
      }

      let distanciaInicial = 0;
      let zoomInicial = 1;

      function distancia(toques) {
        const dx = toques[0].clientX - toques[1].clientX;
        const dy = toques[0].clientY - toques[1].clientY;
        return Math.hypot(dx, dy);
      }

      window.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          distanciaInicial = distancia(e.touches);
          zoomInicial = zoom;
        }
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && distanciaInicial > 0) {
          aplicarZoom(zoomInicial * distancia(e.touches) / distanciaInicial);
        }
      }, { passive: true });

      window.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) distanciaInicial = 0;
      });

      window.addEventListener('wheel', (e) => {
        aplicarZoom(zoom * (e.deltaY < 0 ? 1.1 : 0.9));
      });

      function reiniciarEscena() {
        const audio = document.querySelector("#musica-espacio");
        audio.pause();
        audio.currentTime = 0;
        document.querySelector("#mi-nave").components['nave-interactiva'].reiniciar();
        aplicarZoom(1);
      }
    </script>
  </head>

  <body>

    <video id="fondo-camara" autoplay playsinline muted></video>
    <button id="btn-reiniciar" onclick="reiniciarEscena()">Reiniciar</button>
    <audio id="musica-espacio" src="musica.mp3" preload="auto" loop></audio>

    <a-scene
      renderer="alpha: true; antialias: true; logarithmicDepthBuffer: true; colorManagement: true;"
      cursor="rayOrigin: mouse"
      raycaster="objects: .interactivo"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >

      <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
      <a-light type="directional" color="#ffffff" intensity="1" position="1 3 2"></a-light>

      <a-assets>
        <a-asset-item id="nave1" src="Swift.glb"></a-asset-item>
      </a-assets>

      <a-entity id="ancla" position="0 0 -6">
        <a-entity animation__flote="property: position; from: 0 -0.12 0; to: 0 0.12 0; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine">
          <a-entity id="mi-nave" nave-interactiva>
            <a-entity gltf-model="#nave1" ajustar-tamano></a-entity>
            <a-sphere id="zona-toque" class="interactivo" radius="1.3"
                      material="opacity: 0; transparent: true; depthWrite: false"></a-sphere>
          </a-entity>
          <a-ring id="onda" radius-inner="0.9" radius-outer="1" scale="0.001 0.001 0.001"
                  material="shader: flat; color: #7fe3ff; transparent: true; opacity: 0; side: double"
                  animation__crece="property: scale; from: 0.3 0.3 0.3; to: 3 3 3; dur: 800; easing: easeOutCubic; startEvents: pulso"
                  animation__desvanece="property: components.material.material.opacity; from: 0.9; to: 0; dur: 800; easing: easeOutQuad; startEvents: pulso"></a-ring>
        </a-entity>
      </a-entity>

      <a-entity camera="fov: 80" position="0 0 0" look-controls="enabled: false" wasd-controls="enabled: false"></a-entity>

    </a-scene>

  </body>
</html>
